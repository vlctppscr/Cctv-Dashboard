function onChange(p){if(!LOADED)return;const t=p.table,ty=p.eventType;
 if(t==='events'||t==='audit'){const A=TB[t].get(),T=TB[t];
  if(ty==='DELETE'){const id=p.old&&p.old.id,i=A.findIndex(x=>x.id===id);if(i>=0){A.splice(i,1);rr()}delete SNAP[t][id];return}
  const o=T.from(p.new),j=J(T.to(o,0));if(SNAP[t][o.id]===j)return;
  const i=A.findIndex(x=>x.id===o.id);if(i>=0)A[i]=o;else A.push(o);if(t==='audit')A.sort((a,b)=>b.at-a.at);SNAP[t][o.id]=j;rr();return}
 if(t==='settings'){const r=p.new;if(r&&r.key==='plant'&&typeof r.value==='string'&&r.value!==S.plant){S.plant=r.value;SNAPP=r.value;rr()}return}
 if(t==='resources'||t==='cameras')structSync()}
function subscribe(){DB.channel('cctv-live').on('postgres_changes',{event:'*',schema:'public'},onChange).subscribe(s=>{if(s==='SUBSCRIBED'){setSync('ok');if(SUBN++)resync()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')setSync('wait')})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&LOADED&&Date.now()-LASTSYNC>15000)resync()});addEventListener('online',()=>{if(LOADED)resync()});
const bootMsg=(t,b)=>$('#main').innerHTML=`<div class="card p-6 max-w-2xl"><div class="text-lg font-semibold mb-2">${t}</div><div class="text-sm text-slate-300 space-y-2">${b}</div></div>`;
async function boot(){
 if(!/^https:\/\/.+/.test(SUPABASE_URL)||SUPABASE_KEY.length<30)return bootMsg('Supabase connect nahi hua','<p>File ke sabse upar <b>SUPABASE_URL</b> aur <b>SUPABASE_KEY</b> me apne Supabase project ki Project URL aur anon public key paste karein.</p>');
 if(!window.supabase)return bootMsg('Supabase library load nahi hui','<p>Internet check karke page dubara kholein.</p><button class="btn" onclick="location.reload()">Retry</button>');
 DB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);setSync('wait');bootMsg('Loading…','<p>Database se data aa raha hai…</p>');
 try{await loadAll()}catch(e){console.error(e);const m=String(e&&e.message||e);setSync('err');return bootMsg('Database se connect nahi ho paya',`<p class="text-rose-300">${esc(m)}</p><p>${/does not exist|schema cache|relation/i.test(m)?'Lagta hai tables abhi bane nahi – Supabase SQL Editor me <b>supabase-setup.sql</b> run karein.':'URL / key check karein aur internet dekhein.'}</p><button class="btn" onclick="location.reload()">Retry</button>`)}
 LOADED=true;subscribe();R()}

boot();
</script></body></html>
